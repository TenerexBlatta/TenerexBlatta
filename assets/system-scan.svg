<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-label="Profile scan">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22ff88" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22ff88" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g" cx="20%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#0a8f1a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a8f1a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="2" y="2" width="796" height="356" rx="14"/></clipPath>
  </defs>

  <rect x="2" y="2" width="796" height="356" rx="14" fill="#03100a" stroke="#0f7a2a" stroke-width="1.5"/>
  <g clip-path="url(#clip)"><rect width="800" height="360" fill="url(#g)"/></g>

  <!-- title bar -->
  <line x1="2" y1="34" x2="798" y2="34" stroke="#0f7a2a"/>
  <circle cx="20" cy="18" r="4.5" fill="#ff5f56"/>
  <circle cx="36" cy="18" r="4.5" fill="#ffbd2e"/>
  <circle cx="52" cy="18" r="4.5" fill="#27c93f"/>
  <text x="400" y="22" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#86efac">tenerexblatta@github ~ $ ./profile-scan --live</text>
  <circle cx="728" cy="18" r="3.5" fill="#22c55e"/>
  <text x="738" y="22" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#22c55e">LIVE</text>

  <!-- visual map panel -->
  <rect x="14" y="48" width="296" height="296" rx="10" fill="#020b06" stroke="#0f7a2a"/>
  <text x="26" y="66" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#4ade80" letter-spacing="2">VISUAL.MAP</text>
  <g font-family="Courier New, monospace" font-size="11" fill="#22c55e" style="white-space:pre" xml:space="preserve" transform="translate(30 0)">
    <text x="120" y="130">@c#</text>
    <text x="120" y="144">@+ #</text>
    <text x="120" y="158">@c  #</text>
    <text x="120" y="172">@:.++</text>
    <text x="120" y="186">#c+++#  #</text>
    <text x="26"  y="200">++#++#++++++   #######. + ++++@</text>
    <text x="26"  y="214">+#  +  c + #. ##   +       +#++@</text>
    <text x="34"  y="228">########   #####+ ++####   #</text>
    <text x="40"  y="242">## ++##       + +##       ###</text>
    <text x="40"  y="256">#++:        # +#     #</text>
    <text x="26"  y="270">##          #  ++      ##</text>
    <text x="26"  y="284">+++#: .#    c:++#   #</text>
    <text x="120" y="298">#  +#</text>
    <text x="120" y="312">#c  +#</text>
    <text x="120" y="326">@###</text>
  </g>
  <rect x="14" y="190" width="296" height="40" fill="url(#scan)"/>

  <!-- system info panel -->
  <rect x="322" y="48" width="464" height="296" rx="10" fill="#020b06" stroke="#0f7a2a"/>
  <text x="336" y="66" font-family="Courier New, monospace" font-size="9" font-weight="700" fill="#4ade80" letter-spacing="2">SYSTEM.INFO</text>
  <g font-family="Courier New, monospace" font-size="11">
    <g fill="#22c55e" font-weight="700">
      <text x="336" y="96">Subject</text>
      <text x="336" y="120">Handle</text>
      <text x="336" y="144">Role</text>
      <text x="336" y="168">Focus</text>
      <text x="336" y="192">Languages</text>
      <text x="336" y="216">Frontend</text>
      <text x="336" y="240">Backend</text>
      <text x="336" y="264">Tooling</text>
      <text x="336" y="288">Location</text>
      <text x="336" y="312">Status</text>
      <text x="336" y="336">Contact</text>
    </g>
    <g fill="#166534">
      <text x="440" y="96">...............</text>
      <text x="440" y="120">...............</text>
      <text x="440" y="144">...............</text>
      <text x="440" y="168">...............</text>
      <text x="440" y="192">...............</text>
      <text x="440" y="216">...............</text>
      <text x="440" y="240">...............</text>
      <text x="440" y="264">...............</text>
      <text x="440" y="288">...............</text>
      <text x="440" y="312">...............</text>
      <text x="440" y="336">...............</text>
    </g>
    <g fill="#86efac">
      <text x="572" y="96">Tomás Monge</text>
      <text x="572" y="120">@tenerexblatta</text>
      <text x="572" y="144">CS Engineering student</text>
      <text x="572" y="168">Full-stack web · Systems</text>
      <text x="572" y="192">C · Java · Python · JS/TS · SQL</text>
      <text x="572" y="216">HTML/CSS · React · Next.js</text>
      <text x="572" y="240">Node.js · Express</text>
      <text x="572" y="264">Git · Docker · Linux · Figma</text>
      <text x="572" y="288">Chile</text>
      <text x="572" y="312">Building | Learning | Shipping</text>
      <text x="572" y="336">github.com/tenerexblatta</text>
